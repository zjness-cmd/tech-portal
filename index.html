<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>TechPortal</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#185FA5" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechPortal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />

    <!-- Prevent phone number auto-detection -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        // Whether this page already had a controller before registering —
        // distinguishes a real update (reload needed to pick up the new
        // controller) from the very first-ever install (page is already
        // showing fresh content, nothing to reload for).
        const hadController = !!navigator.serviceWorker.controller;

        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => {
            console.log('[TechPortal] SW registered:', reg.scope);
            reg.update();
            // Re-check for a new version each time the app is reopened/
            // foregrounded — not just on the initial load — so a build
            // shipped while the PWA was closed/backgrounded gets picked up
            // the next time it's opened, without waiting on the browser's
            // own (much slower) background update schedule.
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
          })
          .catch(err => console.warn('[TechPortal] SW failed:', err));

        // sw.js already calls self.skipWaiting()/clients.claim(), so a new
        // service worker takes over as soon as it's installed — but the
        // page itself keeps running the old JS in memory until it reloads.
        // Reload exactly once when control switches to the new worker, so
        // an update actually reaches the screen instead of silently
        // installing underneath a stale page (previously the only way to
        // get unstuck was clearing site data, which also wiped the login).
        let refreshedForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || refreshedForUpdate) return;
          refreshedForUpdate = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
